<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0D0118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Knorri">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Knorri AI</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Quicksand',sans-serif}
:root{
  --bg:#03000A;--bg2:#0D0118;
  --card:rgba(255,255,255,0.04);--card-b:rgba(255,255,255,0.08);
  --v:#8B5CF6;--p:#FF2D92;--c:#00E5FF;--g:#00E676;--y:#FFD700;--r:#FF4444;
  --text:#F0E8FF;--soft:rgba(240,232,255,0.45);
  --gv:rgba(139,92,246,0.3);--gp:rgba(255,45,146,0.25);
}
body{background:var(--bg);color:var(--text)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 50% at 20% 0%,rgba(139,92,246,0.15),transparent 60%),
             radial-gradient(ellipse 60% 40% at 80% 100%,rgba(255,45,146,0.1),transparent 60%)}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) var(--delay,0s) infinite alternate}
@keyframes twinkle{from{opacity:.1;transform:scale(1)}to{opacity:.8;transform:scale(1.3)}}
#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto}

/* ── AUTH ── */
#auth{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at 50% 30%,rgba(139,92,246,0.2),var(--bg) 70%)}
.auth-bear{position:relative;margin-bottom:20px}
.auth-bear-glow{position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,0.3),transparent 70%);animation:gpulse 2.5s ease-in-out infinite}
@keyframes gpulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.auth-svg{width:86px;height:86px;filter:drop-shadow(0 0 18px rgba(0,229,255,0.5));animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.auth-title{font-family:'Fredoka One',cursive;font-size:30px;background:linear-gradient(135deg,var(--c),var(--v),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;margin-bottom:4px;text-align:center}
.auth-sub{font-size:12px;color:var(--soft);font-weight:700;margin-bottom:24px;text-align:center}
.auth-box{width:100%;max-width:360px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:24px;padding:22px 18px;backdrop-filter:blur(20px)}
.atabs{display:flex;background:rgba(0,0,0,0.3);border-radius:11px;padding:3px;margin-bottom:18px}
.atab{flex:1;padding:8px;text-align:center;border:none;background:transparent;color:var(--soft);font-family:'Quicksand',sans-serif;font-size:12px;font-weight:700;border-radius:9px;cursor:pointer;transition:all .2s}
.atab.active{background:linear-gradient(135deg,var(--v),var(--p));color:#fff}
.aform{display:flex;flex-direction:column;gap:11px}
.aform.hide{display:none !important}
.flabel{font-size:10px;font-weight:700;color:var(--soft);letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:4px}
.finput{background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.09);border-radius:11px;padding:10px 13px;font-family:'Quicksand',sans-serif;font-size:13px;font-weight:600;color:var(--text);outline:none;transition:border-color .2s;width:100%;-webkit-appearance:none}
.finput:focus{border-color:var(--v)}
.finput::placeholder{color:rgba(240,232,255,0.2)}
.aerr{background:rgba(255,68,68,0.15);border:1px solid rgba(255,68,68,0.3);border-radius:9px;padding:8px 12px;font-size:11px;font-weight:700;color:#FF8888;display:none}
.abtn{background:linear-gradient(135deg,var(--v),var(--p));border:none;border-radius:12px;padding:12px;font-family:'Quicksand',sans-serif;font-size:14px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 4px 18px rgba(139,92,246,0.35);transition:transform .15s;margin-top:2px}
.abtn:active{transform:scale(0.97)}
.anote{font-size:10px;color:var(--soft);text-align:center;margin-top:10px;font-weight:600}

/* ── HEADER ── */
#hdr{display:none;align-items:center;gap:9px;padding:10px 14px 8px;flex-shrink:0;border-bottom:1px solid var(--card-b);background:rgba(3,0,10,0.75);backdrop-filter:blur(20px);position:sticky;top:0;z-index:50}
.hmenu{width:34px;height:34px;background:var(--card);border:1px solid var(--card-b);border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;flex-shrink:0}
.htitle{font-family:'Fredoka One',cursive;font-size:17px;background:linear-gradient(135deg,var(--c),var(--v));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.hbadge{display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:18px;font-size:10px;font-weight:700;background:rgba(139,92,246,0.12);border:1px solid rgba(139,92,246,0.25);color:var(--v);cursor:pointer;margin-left:auto;flex-shrink:0}
.havatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--p));display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;cursor:pointer;border:2px solid rgba(139,92,246,0.35)}

/* ── TABS ── */
#tabs{display:none;flex-shrink:0;background:rgba(3,0,10,0.6);backdrop-filter:blur(20px);border-bottom:1px solid var(--card-b);overflow-x:auto;scrollbar-width:none;padding:0 6px}
#tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:7px 9px;border:none;background:transparent;cursor:pointer;min-width:50px;position:relative}
.tab .ti{font-size:17px;transition:transform .2s}.tab .tl{font-size:8px;font-weight:700;color:var(--soft);white-space:nowrap;font-family:'Quicksand',sans-serif}
.tab.active .tl{color:var(--v)}.tab.active .ti{transform:scale(1.12)}
.tab.active::after{content:'';position:absolute;bottom:0;left:15%;width:70%;height:2px;background:linear-gradient(90deg,var(--v),var(--p));border-radius:2px 2px 0 0}

/* ── MAIN ── */
#main{flex:1;overflow-y:auto;overflow-x:hidden}
#main::-webkit-scrollbar{width:3px}
#main::-webkit-scrollbar-thumb{background:rgba(139,92,246,.25);border-radius:2px}
.screen{display:none;padding:13px;animation:fadeUp .25s ease}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--card-b);border-radius:17px;padding:14px;margin-bottom:11px;backdrop-filter:blur(10px)}
.ctitle{font-family:'Fredoka One',cursive;font-size:13px;color:var(--v);margin-bottom:9px;display:flex;align-items:center;gap:5px}
.stitle{font-family:'Fredoka One',cursive;font-size:16px;color:var(--text);margin-bottom:11px}

/* ── BUTTONS ── */
.btn{background:linear-gradient(135deg,var(--v),var(--p));border:none;border-radius:11px;padding:10px 16px;font-family:'Quicksand',sans-serif;font-size:12px;font-weight:700;color:#fff;cursor:pointer;transition:transform .15s;box-shadow:0 4px 14px rgba(139,92,246,0.3)}
.btn:active{transform:scale(0.96)}
.btn-full{width:100%;padding:12px;font-size:13px;border-radius:13px}
.btn-ghost{background:var(--card);border:1px solid var(--card-b);color:var(--v);box-shadow:none}

/* ── INPUTS ── */
input,textarea,select{font-family:'Quicksand',sans-serif;font-size:13px;font-weight:600;background:rgba(255,255,255,0.05);border:1.5px solid var(--card-b);border-radius:10px;padding:8px 11px;color:var(--text);outline:none;transition:border-color .2s;width:100%;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--v)}
input::placeholder,textarea::placeholder{color:rgba(240,232,255,.2)}
textarea{resize:none}
select option{background:#1a0a2e;color:var(--text)}

/* ── HOLOGRAM ── */
.holo-wrap{display:flex;flex-direction:column;align-items:center;padding:14px 0 6px;position:relative}
.holo-ring{position:absolute;top:0;left:50%;transform:translateX(-50%);width:155px;height:155px;border-radius:50%;border:1px solid rgba(0,229,255,0.18);animation:rspin 8s linear infinite}
.holo-ring::before{content:'';position:absolute;top:50%;left:-4px;width:7px;height:7px;background:var(--c);border-radius:50%;box-shadow:0 0 10px var(--c);transform:translateY(-50%)}
.holo-ring2{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:135px;height:135px;border-radius:50%;border:1px solid rgba(139,92,246,0.12);animation:rspin 5s linear infinite reverse}
@keyframes rspin{to{transform:translateX(-50%) rotate(360deg)}}
.holo-svg{width:108px;height:108px;filter:drop-shadow(0 0 12px rgba(0,229,255,0.55)) drop-shadow(0 0 28px rgba(139,92,246,0.35));animation:hfloat 3s ease-in-out infinite;position:relative;z-index:1}
@keyframes hfloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
.holo-scanlines{position:absolute;top:0;left:50%;transform:translateX(-50%);width:108px;height:108px;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,229,255,0.035) 3px,rgba(0,229,255,0.035) 4px);pointer-events:none;z-index:2;border-radius:50%}
.holo-name{font-family:'Fredoka One',cursive;font-size:21px;margin-top:7px;background:linear-gradient(135deg,var(--c),var(--v),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
.holo-status{font-size:10px;font-weight:700;color:var(--c);letter-spacing:1.5px;margin-top:2px;text-transform:uppercase;display:flex;align-items:center;gap:4px}
.sdot{width:5px;height:5px;background:var(--c);border-radius:50%;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 5px var(--c)}50%{opacity:.3;box-shadow:none}}

/* ── CHAT ── */
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.chip{background:var(--card);border:1px solid var(--card-b);border-radius:18px;padding:5px 11px;font-family:'Quicksand',sans-serif;font-size:11px;font-weight:700;color:var(--v);cursor:pointer;white-space:nowrap;transition:all .15s}
.chip:active{background:rgba(139,92,246,.15);border-color:var(--v)}
.msgs{display:flex;flex-direction:column;gap:9px;min-height:100px}
.msg{max-width:86%;padding:9px 12px;border-radius:15px;font-size:13px;line-height:1.55;font-weight:600;animation:minIn .2s cubic-bezier(.34,1.56,.64,1)}
@keyframes minIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.msg-k{background:rgba(139,92,246,0.09);border:1px solid rgba(139,92,246,0.18);align-self:flex-start;border-bottom-left-radius:4px}
.msg-u{background:linear-gradient(135deg,var(--v),var(--p));color:#fff;align-self:flex-end;border-bottom-right-radius:4px;box-shadow:0 2px 14px rgba(139,92,246,0.28)}
.msender{font-size:9.5px;font-weight:700;margin-bottom:3px;opacity:.6;text-transform:uppercase;letter-spacing:.4px}
.msg-k .msender{color:var(--c)}.msg-u .msender{color:rgba(255,255,255,.7)}
.typing{display:flex;gap:4px;padding:10px 12px}
.td{width:6px;height:6px;background:var(--v);border-radius:50%;animation:tdot 1.2s infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.cin-row{display:flex;gap:6px;align-items:flex-end;margin-top:9px}
.cin-row textarea{flex:1;border-radius:12px;padding:9px 11px;max-height:78px}
.sbtn{width:40px;height:40px;flex-shrink:0;border:none;border-radius:11px;cursor:pointer;background:linear-gradient(135deg,var(--v),var(--p));font-size:16px;box-shadow:0 4px 13px rgba(139,92,246,.38);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.sbtn:active{transform:scale(.93)}.sbtn:disabled{opacity:.4}
.lbar{display:none;background:linear-gradient(135deg,rgba(255,215,0,.12),rgba(255,100,0,.12));border:1px solid rgba(255,200,0,.2);border-radius:11px;padding:8px 11px;margin-bottom:8px;align-items:center;gap:7px}
.lbar.show{display:flex}
.lbar-txt{flex:1;font-size:11px;font-weight:700;color:var(--y)}
.lbar-btn{background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.25);border-radius:8px;padding:4px 10px;font-family:'Quicksand',sans-serif;font-size:11px;font-weight:700;color:var(--y);cursor:pointer;white-space:nowrap}

/* ── MOOD ── */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mbtn{background:var(--card);border:1.5px solid var(--card-b);border-radius:13px;padding:13px 5px;cursor:pointer;text-align:center;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:4px}
.mbtn.sel{border-color:var(--v);background:rgba(139,92,246,.09);transform:scale(1.05)}
.me{font-size:25px}.ml{font-size:10px;font-weight:700;color:var(--soft)}

/* ── PLANNING ── */
.drow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.drow::-webkit-scrollbar{display:none}
.dbtn{flex-shrink:0;padding:6px 11px;border-radius:9px;border:1px solid var(--card-b);background:var(--card);font-family:'Quicksand',sans-serif;font-size:10px;font-weight:700;color:var(--soft);cursor:pointer;transition:all .2s}
.dbtn.active{background:linear-gradient(135deg,var(--v),var(--p));color:#fff;border-color:transparent}
.titem{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--card);border:1px solid var(--card-b);border-radius:10px;margin-bottom:5px}
.titem.done{opacity:.4}.titem.done .ttext{text-decoration:line-through}
.tchk{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--card-b);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;transition:all .2s}
.titem.done .tchk{background:var(--g);border-color:var(--g);color:#000}
.ttext{font-size:12px;font-weight:700;flex:1}
.ctag{padding:2px 7px;border-radius:7px;font-size:9px;font-weight:700;text-transform:uppercase}
.ct-school{background:rgba(255,215,0,.12);color:var(--y)}.ct-sport{background:rgba(0,230,118,.12);color:var(--g)}
.ct-hobby{background:rgba(139,92,246,.12);color:var(--v)}.ct-eten{background:rgba(255,45,146,.12);color:var(--p)}

/* ── GOALS ── */
.gitem{background:var(--card);border:1px solid var(--card-b);border-radius:12px;padding:11px;margin-bottom:7px}
.grow{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.gname{font-size:12px;font-weight:700}
.gbar{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin-bottom:3px}
.gfill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--v),var(--p));transition:width .5s ease}
.gpct{font-size:9.5px;font-weight:700;color:var(--soft)}
.gctrl{display:flex;gap:4px;align-items:center}
.gbtn{background:var(--card);border:1px solid var(--card-b);border-radius:6px;padding:2px 7px;cursor:pointer;font-weight:700;font-size:11px;font-family:'Quicksand',sans-serif;color:var(--text)}

/* ── STATS ── */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
.sbox{background:var(--card);border:1px solid var(--card-b);border-radius:14px;padding:13px;text-align:center}
.sicon{font-size:25px;display:block;margin-bottom:4px}
.snum{font-family:'Fredoka One',cursive;font-size:25px;color:var(--v)}
.slbl{font-size:10px;font-weight:700;color:var(--soft);margin-top:2px}
.ach{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--card-b);border-radius:11px;padding:10px;margin-bottom:6px}
.aicon{width:36px;height:36px;border-radius:9px;background:rgba(139,92,246,.12);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ainfo{flex:1}.ainfo h4{font-size:11px;font-weight:700}.ainfo p{font-size:10px;color:var(--soft);font-weight:600}
.abadge{background:linear-gradient(135deg,rgba(255,215,0,.18),rgba(255,150,0,.18));color:var(--y);border:1px solid rgba(255,215,0,.25);padding:2px 8px;border-radius:7px;font-size:9px;font-weight:700;flex-shrink:0}

/* ── SETTINGS ── */
.slabel{font-size:10px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
.keywrap{position:relative}.keywrap input{padding-right:38px}
.keyeye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:14px;color:var(--soft)}

/* ── SIDEBAR ── */
#sidebar{position:fixed;top:0;left:-285px;width:285px;height:100dvh;z-index:200;background:rgba(3,0,10,0.96);backdrop-filter:blur(30px);border-right:1px solid var(--card-b);transition:left .3s cubic-bezier(.34,1.2,.64,1);display:flex;flex-direction:column}
#sidebar.open{left:0}
#sbov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199;display:none;backdrop-filter:blur(3px)}
#sbov.show{display:block}
.sbhead{padding:48px 15px 13px;border-bottom:1px solid var(--card-b)}
.sbuser{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.sbav{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--p));display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.sbname{font-size:14px;font-weight:700}.sbemail{font-size:10px;color:var(--soft);font-weight:600}
.sbplan{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:9px;font-size:10px;font-weight:700;margin-top:5px;background:rgba(139,92,246,.12);color:var(--v);border:1px solid rgba(139,92,246,.22)}
.sbnew{margin:10px;background:linear-gradient(135deg,var(--v),var(--p));border:none;border-radius:11px;padding:9px 13px;color:#fff;font-family:'Quicksand',sans-serif;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;width:calc(100% - 20px)}
.sbsec{font-size:9px;font-weight:700;color:var(--soft);letter-spacing:1.5px;text-transform:uppercase;padding:7px 15px 3px}
.clist{flex:1;overflow-y:auto;padding:0 9px 9px}
.clist::-webkit-scrollbar{width:2px}
.clist::-webkit-scrollbar-thumb{background:rgba(139,92,246,.15);border-radius:2px}
.chi{display:flex;align-items:center;gap:7px;padding:8px 7px;border-radius:9px;cursor:pointer;transition:background .15s;margin-bottom:2px}
.chi:hover,.chi.active{background:rgba(139,92,246,.13)}
.chi-ic{font-size:14px;flex-shrink:0}.chi-t{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chi-d{font-size:9.5px;color:var(--soft);font-weight:600}
.chi-del{background:none;border:none;cursor:pointer;font-size:12px;opacity:0;transition:opacity .15s;color:var(--soft)}
.chi:hover .chi-del{opacity:.55}
.sbbottom{border-top:1px solid var(--card-b);padding:11px 15px}
.sbout{width:100%;background:var(--card);border:1px solid var(--card-b);border-radius:9px;padding:8px;font-family:'Quicksand',sans-serif;font-size:11px;font-weight:700;color:var(--soft);cursor:pointer}

/* ── SUB MODAL ── */
#submod{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.78);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:15px}
#submod.show{display:flex}
.subcard{background:rgba(13,1,24,.96);border:1px solid rgba(139,92,246,.28);border-radius:22px;padding:22px 18px;max-width:415px;width:100%;max-height:90dvh;overflow-y:auto;animation:fadeUp .3s ease}
.subcard::-webkit-scrollbar{display:none}
.pbox{border:1.5px solid var(--card-b);border-radius:14px;padding:14px;margin-bottom:9px;position:relative;cursor:pointer;transition:border-color .2s}
.pbox:hover{border-color:var(--v)}.pbox.pop{border-color:var(--v)}
.ppop{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:linear-gradient(1
